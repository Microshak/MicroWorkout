<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>MicroWorkout — splash mark</title>
  <!-- The mark alone on transparency: the macOS/Android boot splash paints it over the ink
       bg colour, and the boot screen draws the same PNG above its wordmark. -->
