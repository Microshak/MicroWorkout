    <path d="M66 196 L66 78 L128 173 L190 78 L190 196"
          stroke="#FF6B35" stroke-width="38" stroke-linejoin="round" stroke-linecap="butt" fill="none"/>
    <path d="M121 79 L121 99 L139 89 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
